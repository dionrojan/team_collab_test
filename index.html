<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Portfolio Gateway</title>
    <meta name="description" content="Gateway to our team's professional portfolios.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    <main class="container">
        <header class="hero">
            <h1 class="title">Creative Collective</h1>
            <p class="subtitle">Discover the brilliant minds shaping the future.</p>
        </header>

        <section class="action-section">
            <p class="instruction">Explore our individual portfolios and see what we've been building.</p>
            <div class="button-group">
                <a href="#portfolios" class="btn primary-btn" id="exploreBtn">Meet the Team</a>
            </div>
        </section>

        <!-- Placeholder for future portfolio links -->
        <section id="portfolios" class="portfolios hidden">
            <h2>Our Team</h2>
            <div class="team-grid">
                <div class="team-member-card glass-panel">
                    <div class="avatar placeholder-avatar1"></div>
                    <h3>Joseph J</h3>
                    <p>Frontend Developer</p>
                    <a href="https://josephj.vercel.app" target="_blank">
                        <button class="btn view-btn">View Portfolio</button>
                    </a>
                </div>
                <div class="team-member-card glass-panel">
                    <div class="avatar placeholder-avatar2"></div>
                    <h3>Joel Binoy</h3>
                    <p>UI/UX Designer</p>
                    <a href="https://joelbinoy2021-sketch.github.io/joel-portfolio/" target="_blank">
                        <button class="btn view-btn">View Portfolio</button>
                    </a>
                </div>
                <div class="team-member-card glass-panel">
                    <img src="Dion_portfoli/assets/profile.jpg" class="avatar" alt="Dion Rojan" style="object-fit: cover;">
                    <h3>Dion Rojan</h3>
                    <p>Backend Engineer</p>
                    <a href="Dion_portfoli/index.html" target="_blank">
                        <button class="btn view-btn">View Portfolio</button>
                    </a>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
